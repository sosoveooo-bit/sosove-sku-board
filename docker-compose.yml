services:
  sosove-sku-board:
    build:
      context: .
    container_name: sosove-sku-board
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PANEL_PORT:-8793}:8793"
    environment:
      SKU_BOARD_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8793/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
