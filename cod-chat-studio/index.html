<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COD 对话创作室</title><link rel="stylesheet" href="/style.css"></head><body>
<link rel="stylesheet" href="/history-menu.css"><script src="/history-menu.js" defer></script>
<aside><div class="brand"><b>S</b> SOSOVE AI<button id="fold" aria-label="收起侧栏">☰</button></div><button id="new">＋ 新对话</button><nav><button id="creations">▧ 我的创作</button><button id="promptLibrary">▤ 提示词起点</button></nav><div class="history-heading">历史对话 <small>本地保存</small></div><input id="searchHistory" placeholder="搜索对话" aria-label="搜索历史对话"><div id="history"></div><footer>● 本地工作台 · 8795<br><a href="http://127.0.0.1:8793/" target="_blank" rel="noopener">原面板 / 模型与节点设置 ↗</a></footer></aside>
<main><header><button id="unfold" aria-label="展开侧栏">☰</button><label class="suite-picker">对话生图 <select id="suite" aria-label="创作模式" aria-describedby="suiteHint"><option value="cod-country-landing-30">COD 国家专区</option><option value="jp-landing-page-25">日本产品落地页25图</option><option value="cod-country-detail-12">COD详情图</option></select></label><span id="identity">连接本地引擎…</span></header><p id="suiteHint" class="suite-hint"></p>
<section id="login" hidden><h2>使用原面板账号登录</h2><form id="loginForm"><input name="username" placeholder="账号" required autocomplete="username"><input name="password" type="password" placeholder="密码" required autocomplete="current-password"><button>登录</button></form></section>
<section class="intro"><div class="welcome-mark">✧</div><h1>今天想为哪款产品创作？</h1><p>上传产品参考图，告诉我卖点与目标市场，一起完成整套图片。</p><div class="starters"><button data-starter="日本市场产品套图。请分析上传的产品，保持外观一致，先给出逐页卖点与画面方案。我的卖点："><b>▧ 产品套图</b><span>从真实产品到完整落地页</span></button><button data-starter="制作卖点详情图，每页聚焦一个卖点，搭配使用场景、细节与对比。配色统一，但构图不同。我的卖点："><b>✧ 卖点详情</b><span>让每个卖点都有画面表达</span></button><button data-starter="制作日本市场服装图，保持面料、颜色与版型，不新增蕾丝或配件，采用不同姿态和镜头。具体需求："><b>♧ 服装展示</b><span>产品细节与人物场景兼顾</span></button></div></section>
<link rel="stylesheet" href="/company-layout.css"><link rel="stylesheet" href="/workflow.css"><div id="workflow" class="workflow-strip" aria-live="polite"></div><div id="messages" aria-live="polite"></div><div id="plan"></div><div id="results"></div>
<section class="composer"><div class="settings"><label>市场 <select id="country"><option value="JP">日本 / 日语</option><option value="US">美国 / 英语</option><option value="GB">英国 / 英语</option><option value="KR">韩国 / 韩语</option></select></label><label>页数 <input id="count" type="number" min="8" max="30" value="14"></label><span>750 × 1000 · 高质量</span></div><label class="automation"><input id="autoGenerate" type="checkbox" checked>方案完整后自动生成图片（调用生图额度）</label><div id="files"></div><textarea id="input" aria-label="产品需求与对话" placeholder="上传图片，直接描述产品、卖点、市场与风格。&#10;可写：共14张，日本市场，配色#f1eff0，直接生成。也可以输入“先出方案”。"></textarea><div class="actions"><label class="upload">＋ 产品参考图<input id="upload" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden></label><div><button id="cancelTask" type="button">取消本次任务</button><button id="pause" hidden>暂停后续步骤</button><button id="send">发送并制作 ↗</button></div></div><p class="note">分析与生图都可能消耗上游额度。取消勾选可先看方案；刷新页面后不会自动重提图片任务。不做成图 AI 质检。</p><div id="cancelStatus" role="status"></div><div id="status" role="status"></div></section></main><script src="/workflow.js" defer></script><script src="/app.js" defer></script></body></html>
